name: CI

on:
  push:
    branches:
      - main
      - lab
  pull_request:
    branches:
      - main
      - lab

permissions:
  contents: read

jobs:
  typescript:
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: MCP

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: MCP/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
